# ingest settings
ingest:
  timeout_seconds: 30
  retries: 3
  max_concurrent_requests: 5
  github_per_source: 5
  reddit_per_source: 25
  # Chuỗi User-Agent gửi kèm mọi request RSS — định danh rõ bot + email liên hệ,
  # để chủ nguồn biết ai đang fetch và liên hệ được nếu cần (PRODUCTION_PLAN §8.1).
  user_agent: "industry-intel-bot/0.4 (+mailto:tiencuong.bsr@gmail.com)"

# normalize settings (PRODUCTION_PLAN §8.2 — quy tắc cold start)
normalize:
  max_article_age_days: 7

# filter settings (PRODUCTION_PLAN §7.3, §9)
filter:
  keywords_path: config/keywords.yaml
  interest_profile_path: config/interest_profile.txt
  embedding_threshold: 0.35
  embedding_fallback_threshold: 0.15
  embedding_model: BAAI/bge-small-en-v1.5
  batch_size: 500
  # Filter tối thiểu Phase 0-1 (PRODUCTION_PLAN §9.2) — KHÔNG embedding.
  min_snippet_chars: 80
  # Trần cứng số bài qua LLM/ngày (PRODUCTION_PLAN §21.2). Mặc định = khối lượng ước tính
  # thật của toàn bộ nguồn hiện có (~200 bài/ngày, §9.1/§21.1) — trần đúng bằng khối lượng
  # bình thường, chỉ chặn khi có bất thường, không cắt bớt hoạt động thường ngày.
  max_articles_per_day: 200

# score settings (PRODUCTION_PLAN §10.5, §21.1-21.2)
score:
  # Trần chi phí USD/ngày — vượt thì dừng chấm, giữ bài ở status 'eligible' để hôm sau
  # chấm tiếp (§10.5). Giá DeepSeek rất rẻ (xem models.yaml) nên 1.00 USD/ngày là trần an
  # toàn rộng rãi cho ~200 bài/ngày — chỉnh lại nếu đổi provider/model đắt hơn.
  daily_budget_usd: "1.00"
  # Tóm tắt chỉ sinh cho top-K bài theo composite score — phần output tốn nhất, chỉ áp
  # dụng cho số ít bài nổi bật nhất (§21.2, số 15 lấy nguyên từ plan).
  top_k_summaries: 15
  # Số bài mỗi batch gọi provider — dùng khi provider không có 'max_per_run' riêng trong
  # models.yaml (vd. mock).
  default_batch_size: 10

# publish settings (PRODUCTION_PLAN §12, task 0.11)
publish:
  # Cửa sổ 48h thật sự nằm ở dbt (dbt_project.yml var digest_window_hours) — mart đã tự
  # lọc khi build. Hai giá trị dưới đây giữ lại để tài liệu hoá §12.2 cho người đọc config,
  # KHÔNG dùng để lọc lại trong Python (rào chắn task 0.11).
  window_hours: 48
  # D7/task 1.10: archive_days giờ THẬT SỰ được dùng (src/intel_bot/publish/archive.py) —
  # trước đó chỉ nằm ở đây để tài liệu hoá.
  archive_days: 7
  # D6/task 1.10 (§12.1): nhánh GitHub Pages serve nội dung docs-site/ — KHÔNG phải `main`
  # (GitHub Pages không serve được từ thư mục con tuỳ ý như docs-site/, xem
  # src/intel_bot/publish/git_publish.py). Nhánh này phải được tạo THẬT trên remote trước
  # (bootstrap 1 lần, xem docs/RUNBOOK.md), code không tự tạo.
  gh_pages_branch: "gh-pages"
  # Thư mục worktree cục bộ trỏ nhánh gh_pages_branch — nằm trong .gitignore, KHÔNG phải
  # source, chỉ là nơi trung gian để đồng bộ docs-site/ sang nhánh kia.
  gh_pages_worktree_dir: ".gh-pages-worktree"
  # Link repo hiển thị ở footer trang publish (§12.4) — lấy đúng URL git remote thật, không
  # bịa.
  repo_url: "https://github.com/quybuno/industry-intel-bot"
  docs_site_dir: "docs-site"
  templates_dir: "templates"

# observability settings (PRODUCTION_PLAN §13.4, task 1.5) — khoá config MỚI, chỉ dùng cho
# freshness policy Dagster (dagster_project/checks.py). SLA giống nhau cho cả 3 asset theo
# đúng bảng §13.4 (raw_rss/article_scores/mart_daily_digest đều "< 26h") — mức độ nghiêm
# trọng (warn/critical) khác nhau nằm ở code, không phải ở số giờ.
observability:
  freshness_sla_hours: 26
  # "Trần an toàn" cho fail_window của raw_rss/article_scores — bắt buộc phải có vì
  # FreshnessPolicy.time_window() yêu cầu fail_window (§13.4 chỉ định nghĩa mức Warning cho
  # 2 asset này, không có ngưỡng Critical riêng) — KHÔNG phải một SLA thật, xem giải thích
  # đầy đủ ở dagster_project/checks.py.
  freshness_fail_ceiling_hours: 168
  # Khoá config MỚI (task 1.6, §18.3 "Cost tháng > 80% ngân sách") — trần USD/THÁNG, KHÁC
  # score.daily_budget_usd ở trên (đó là trần/NGÀY, dừng chấm điểm trong ngày — mục đích
  # khác: cost_sensor chỉ CẢNH BÁO, không tự dừng gì).
  monthly_budget_usd: "20.00"
  # Khoá config MỚI (task 1.6, nhiệm vụ 4 "chống spam") — cùng một điều kiện không gửi lại
  # trong N giờ. Dùng chung một cửa sổ cho cả 4 sensor — đơn giản, đủ dùng ở quy mô này (P8),
  # không cần tinh chỉnh riêng từng điều kiện.
  alert_dedup_window_hours: 6
  # Khoá config MỚI (task 1.6, §18.3 "> 30% nguồn fail") — ngưỡng NẰM SẴN trong §18.3 (không
  # phải tự đặt thêm), chỉ chưa có chỗ nào trong code trước task này. KHÔNG có var dbt tương
  # ứng (task 1.4 không tạo — §13.3 không có kiểm tra "nguồn fail"), nên đọc ở config/app.yaml
  # thay vì dbt_project.yml.
  source_fail_rate_threshold: 0.30

timezone: Asia/Ho_Chi_Minh
