# Danh sách nguồn RSS cho task 0.4 (RSS fetcher → bronze.raw_articles).
# Mỗi URL đã được kiểm chứng thật bằng httpx + feedparser (UA thật của bot,
# không giả trình duyệt) trước khi đưa vào đây: HTTP 200, parse được,
# có ít nhất 1 entry, có trường ngày (published/updated).
#
# tier: 1 = báo chuyên ngành đầu ngành (uy tín cao nhất trong lĩnh vực),
#       2 = nguồn chuyên ngành/độc lập uy tín nhưng phạm vi hẹp hơn hoặc quy mô nhỏ hơn,
#       3 = dự trữ cho nguồn tổng hợp/quy mô nhỏ hơn nữa (chưa dùng ở batch này).
sources:
  - source_id: artificial_intelligence_news
    url: https://www.artificialintelligence-news.com/feed/
    domain: artificialintelligence-news.com
    tier: 1
    industries: [ai]
    is_enabled: true

  - source_id: techcrunch_ai
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    domain: techcrunch.com
    tier: 2
    industries: [ai, tech]
    is_enabled: true

  - source_id: construction_dive
    url: https://www.constructiondive.com/feeds/news/
    domain: constructiondive.com
    tier: 1
    industries: [construction]
    is_enabled: true

  - source_id: construction_enquirer
    url: https://www.constructionenquirer.com/feed/
    domain: constructionenquirer.com
    tier: 2
    industries: [construction]
    is_enabled: true

  - source_id: manufacturing_dive
    url: https://www.manufacturingdive.com/feeds/news/
    domain: manufacturingdive.com
    tier: 1
    industries: [manufacturing]
    is_enabled: true

  - source_id: cooling_post
    url: https://www.coolingpost.com/feed/
