    tier: 1
    industries: [hvac]
    is_enabled: true

  - source_id: iot_analytics
    url: https://iot-analytics.com/feed/
    domain: iot-analytics.com
    tier: 1
    industries: [iot]
    is_enabled: true

  - source_id: stacey_on_iot
