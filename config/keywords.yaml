# Blocklist cho filter tối thiểu Phase 0-1 (PRODUCTION_PLAN §9.2, task 0.6).
# So khớp không phân biệt hoa/thường, theo ranh giới từ (word boundary), không khớp
# chuỗi con — vd. "job posting" không khớp "jobs report".
blocklist:
  - webinar
  - webinars
  - sponsored
  - sponsored content
  - sponsored post
  - job posting
  - job postings
  - job listing
  - job listings
  - press release
  - press releases

