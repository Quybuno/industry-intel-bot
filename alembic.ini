[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL that gets used at runtime is DATABASE_URL, read from env in alembic/env.py.
# The value below is only a placeholder and is never used when actually running.
sqlalchemy.url = postgresql+psycopg://user:pass@localhost:5432/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
