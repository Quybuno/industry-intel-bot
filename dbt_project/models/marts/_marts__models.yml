version: 2

models:
  - name: dim_source
    description: SCD2 nguồn tin, sinh từ snapshot snap_sources (PRODUCTION_PLAN §5.6).
    columns:
      - name: source_key
        tests:
          - unique
          - not_null
      - name: source_id
        tests:
          - not_null

  - name: fct_article_score
    description: >
      Bảng fact composite score (PRODUCTION_PLAN §5.7), incremental merge theo
      first_seen_date (§11.3).
    columns:
      - name: score_id
        tests:
          - unique
          - not_null
      - name: article_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_articles')
                field: article_id
      - name: composite_score
        tests:
          - not_null

  - name: mart_daily_digest
    description: >
      Digest 48h, dedup theo content_hash, đã sort theo composite_score giảm dần, có cột
      nhóm ngành, chỉ gồm bài ĐÃ có tóm tắt tiếng Việt (inner join summary) — đầu vào trực
      tiếp của publish, không còn business logic ở Python (§5.8, §12.1).
    columns:
      - name: score_id
        tests:
          - unique
          - not_null
      - name: article_id
        tests:
          - not_null
      - name: summary_vi
        tests:
          - not_null
      - name: title
        tests:
          - not_null
      - name: canonical_url
        tests:
          - not_null
      - name: digest_built_at
        tests:
          - not_null

  - name: mart_pipeline_health
    description: >
      Một dòng một ngày — metrics vận hành (§5.8, §18.2) + input cho 6 kiểm tra bất thường
      (§13.3, task 1.4, xem dbt_project/tests/assert_*_anomaly*.sql +
      assert_quarantine_rate_reasonable.sql/assert_importance_stddev_sufficient.sql/
      assert_empty_tag_rate_reasonable.sql).
    columns:
      - name: pipeline_date
        tests:
          - unique
          - not_null
      - name: scored_count
        description: >
          Số bài được chấm điểm bởi provider PRODUCTION (loại `mock`, xem
          non_production_model_names) trong ngày, theo trục scored_at::date. Bổ sung task
          1.4 — mẫu số thật cho cost_per_article/quarantine_rate, KHÔNG dùng eligible_count
          (khác trục ngày first_seen_date).
      - name: mean_importance
        description: >
          Trung bình `importance` các bài chấm trong ngày (provider production). NULL nếu
          ngày đó chưa chấm bài nào — KHÔNG suy diễn 0. Bổ sung task 1.4, dùng cho kiểm tra
          model drift (§13.3).
      - name: stddev_importance
        description: >
          Độ lệch chuẩn mẫu (STDDEV_SAMP) `importance` trong ngày. NULL nếu < 2 bài được
          chấm (không đủ điểm dữ liệu để tính). Bổ sung task 1.4.
      - name: empty_tag_count
        description: Số bài được chấm trong ngày có `industry_tags` rỗng/NULL. Bổ sung task 1.4.
      - name: empty_tag_rate
        description: >
          `empty_tag_count / scored_count`. NULL nếu `scored_count = 0` — không suy diễn 0%.
          Bổ sung task 1.4.
      - name: cost_per_article
        description: >
          `total_cost_usd / scored_count`. NULL nếu `scored_count = 0`. Bổ sung task 1.4.
      - name: quarantine_rate
        description: >
          `quarantine_count / (scored_count + quarantine_count)`. NULL nếu mẫu số = 0. Bổ
          sung task 1.4.
