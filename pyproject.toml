[project]
name = "industry-intel-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=1.10.2",
    "typer[all]>=0.9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
filter = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
intel-bot = "src.intel_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_bot"]