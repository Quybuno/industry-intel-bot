[project]
name = "industry-intel-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=1.10.2",
    "typer[all]>=0.9.0",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "sqlfluff>=3.0",
    "sqlfluff-templater-dbt>=3.0",
]

[project.optional-dependencies]
filter = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
intel-bot = "src.intel_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_bot"]

[tool.mypy]
# Repo dùng "src.intel_bot.*" nhưng không có __init__.py (implicit namespace package) —
# cần khai báo rõ để mypy không nhầm cùng 1 file thành 2 module khác tên.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Codebase dùng import "from src.intel_bot...." khắp nơi (xem ghi chú packaging đã
# biết ở task 0.2/0.3) — thêm repo root vào sys.path để pytest import được, không
# phụ thuộc cwd.
pythonpath = ["."]
